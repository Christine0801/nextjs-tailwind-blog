<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#10233f"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Gear icon -->
  <g transform="translate(170, 150)" opacity="0.14" fill="#60a5fa">
    <circle cx="60" cy="60" r="40" fill="none" stroke="#60a5fa" stroke-width="14"/>
    <circle cx="60" cy="60" r="14"/>
    <rect x="52" y="6" width="16" height="22" rx="4"/>
    <rect x="52" y="92" width="16" height="22" rx="4"/>
    <rect x="6" y="52" width="22" height="16" rx="4"/>
    <rect x="92" y="52" width="22" height="16" rx="4"/>
  </g>

  <!-- Git branch icon -->
  <g transform="translate(900, 160)" opacity="0.10">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#60a5fa" stroke-width="5"/>
    <circle cx="80" cy="80" r="12" fill="none" stroke="#60a5fa" stroke-width="5"/>
    <circle cx="80" cy="-80" r="12" fill="none" stroke="#60a5fa" stroke-width="5"/>
    <path d="M0,0 L80,-80" stroke="#60a5fa" stroke-width="5" fill="none"/>
    <path d="M0,0 L80,80" stroke="#60a5fa" stroke-width="5" fill="none"/>
  </g>

  <!-- Decorative dots -->
  <g opacity="0.05" fill="#fff">
    <circle cx="50" cy="50" r="2"/><circle cx="150" cy="90" r="2"/><circle cx="260" cy="40" r="2"/>
    <circle cx="360" cy="100" r="2"/><circle cx="1040" cy="50" r="2"/><circle cx="1140" cy="90" r="2"/>
    <circle cx="1090" cy="180" r="2"/><circle cx="100" cy="550" r="2"/><circle cx="210" cy="580" r="2"/>
    <circle cx="1070" cy="560" r="2"/><circle cx="1150" cy="520" r="2"/>
  </g>

  <!-- Main title -->
  <text x="600" y="260" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="52" font-weight="bold" fill="#ffffff">自动部署</text>

  <!-- Subtitle -->
  <text x="600" y="330" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="28" fill="#8899aa">Cloudflare Pages + GitHub CI/CD</text>

  <!-- Accent line -->
  <rect x="450" y="365" width="300" height="4" rx="2" fill="url(#accent)"/>

  <!-- Tags -->
  <text x="600" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#667788">Pages · GitHub Actions · Tutorial</text>

  <!-- Bottom -->
  <text x="600" y="550" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#445566">calvinhiram.top</text>
</svg>
